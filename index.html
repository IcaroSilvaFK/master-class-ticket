<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket de Participação — Masterclass de IA | Ímpar</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Primeira Masterclass de Inteligência Artificial</h1>
      <p class="page-sub">Gere seu ticket de participação personalizado e compartilhe no LinkedIn ou Viva Engage.</p>
    </header>

    <main class="layout">
      <section class="panel form-panel">
        <h2>1. Seus dados</h2>

        <label class="field">
          <span>Nome</span>
          <input type="text" id="nameInput" placeholder="Seu nome completo" maxlength="40" autocomplete="off">
        </label>

        <label class="field">
          <span>Foto</span>
          <input type="file" id="photoInput" accept="image/*">
        </label>

        <h2>2. Baixar e compartilhar</h2>
        <button id="downloadBtn" class="btn btn-primary">Baixar ticket (PNG)</button>

        <label class="field">
          <span>Legenda pronta</span>
          <textarea id="captionText" rows="6" readonly></textarea>
        </label>
        <button id="copyBtn" class="btn btn-secondary">Copiar legenda</button>
      </section>

      <section class="panel preview-panel">
        <h2>Preview</h2>
        <div class="canvas-wrap">
          <canvas id="ticket" width="1080" height="1080"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="ticket.js"></script>
</body>
</html>
